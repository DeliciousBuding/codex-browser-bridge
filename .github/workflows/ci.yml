name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: dtolnay/rust-toolchain@98effd2fc0b766278e30ab86762dd5e9a8531399 # 1.85.0
        with:
          targets: x86_64-pc-windows-msvc,aarch64-pc-windows-msvc
          components: clippy
      - name: Check
        shell: bash
        run: cargo check --locked
      - name: Clippy
        shell: bash
        run: cargo clippy --locked -- -D warnings
      - name: Test
        timeout-minutes: 10
        shell: bash
        run: cargo test --locked
      - name: Test live E2E timeout cleanup
        timeout-minutes: 3
        shell: pwsh
        run: ./scripts/test-live-e2e-timeout.ps1
      - name: Install cargo-llvm-cov
        # Prebuilt binary via taiki-e — avoids `cargo install` compiling the
        # latest cargo-llvm-cov (0.8.7+ needs rustc 1.87, but our MSRV is 1.85).
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        with:
          tool: cargo-llvm-cov
      - name: Coverage
        timeout-minutes: 10
        shell: bash
        run: |
          rustup component add llvm-tools-preview
          cargo llvm-cov --locked --lcov --output-path lcov.info
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: lcov.info
          fail_ci_if_error: false
        continue-on-error: true
      - name: Build x64
        shell: bash
        run: cargo build --locked --release --target x86_64-pc-windows-msvc
      - name: Build arm64
        shell: bash
        run: cargo build --locked --release --target aarch64-pc-windows-msvc

  npm:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
      - name: Check GitHub Action pins
        shell: bash
        run: node scripts/check-actions-pinned.js
      - name: Check release automation contract
        shell: bash
        run: node scripts/check-release-contract.js
      - name: Check agent surface docs
        shell: bash
        run: node scripts/check-agent-surface.js
      - name: Check plugin surface
        shell: bash
        run: node scripts/check-plugin-surface.js
      - name: Test npm installer helpers
        shell: bash
        run: |
          cd npm
          npm test
      - name: Check npm package contents
        shell: bash
        run: |
          cd npm
          npm run check:package

  test-lib:
    # Native GNU builds keep Unix socket tests and both shipped Linux targets
    # covered. Ubuntu 24.04 sets the binary glibc compatibility floor to 2.39.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: dtolnay/rust-toolchain@98effd2fc0b766278e30ab86762dd5e9a8531399 # 1.85.0
        with:
          targets: ${{ matrix.target }}
          components: clippy
      - name: Test Linux
        timeout-minutes: 10
        shell: bash
        run: cargo test --locked
      - name: Clippy Linux
        shell: bash
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build Linux release
        shell: bash
        run: cargo build --locked --release --target "${{ matrix.target }}"
