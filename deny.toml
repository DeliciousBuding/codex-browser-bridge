# cargo-deny configuration — supply-chain checks for a public Rust crate.
# Docs: https://embarkstudios.github.io/cargo-deny/
# Runs in .github/workflows/supply-chain.yml on every PR and weekly.

[graph]
# Cover released binaries and the macOS source-build checks.
targets = [
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "aarch64-pc-windows-msvc" },
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
]

[advisories]
# Fail the build on any known vulnerability or yanked crate.
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
    # Informational maintenance notice, not a vulnerability exception. The
    # upstream rmcp SDK still requires chrono and exposes no replacement.
    { id = "RUSTSEC-2026-0543", reason = "rmcp 3.9.0 transitively requires chrono; revisit when upstream replaces it" },
]

[licenses]
# Permissive licenses only. Kept tight on purpose: if a future dependency
# lands under a license not listed here, cargo-deny fails and forces a review.
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
]
confidence-threshold = 0.8

[bans]
# Duplicate versions are common in transitive deps — warn, don't fail.
multiple-versions = "warn"
wildcards = "deny"

[sources]
# crates.io is the only permitted registry.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
